# Gebaseerd op Geonovum/NL-ReSpec-workflows (build via @v1).
# Aangepast voor nl-digigo: de publish-job naar docs.geostandaarden.nl is verwijderd.
# Let op bij merges vanuit Geonovum: zorg dat de publish-job niet terugkomt.
name: Main Workflow
on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types: [published, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'release' && github.event.release.target_commitish || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    uses: Geonovum/NL-ReSpec-workflows/.github/workflows/build.yml@v1

  # Geen publish-job: de centrale publish-workflow publiceert alleen naar
  # docs.geostandaarden.nl (Geonovum). Dit document wordt via DigiGO gepubliceerd.
